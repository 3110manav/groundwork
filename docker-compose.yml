services:
  postgres:
    # pgvector 0.7+ is required for halfvec. See packages/db/migrations/0001_init.sql
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: chatsdk
      POSTGRES_PASSWORD: chatsdk
      POSTGRES_DB: chatsdk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatsdk"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
